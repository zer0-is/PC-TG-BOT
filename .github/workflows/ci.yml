# Проверки при каждом пуше и pull request.
# Windows-раннер: бот и панель целевые для Windows, тесты используют
# реестр, процессы и файловые операции Windows.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-panel.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy pcbot bot.py control_panel.py

      - name: Тесты
        run: python -m pytest -v
        env:
          BOT_TOKEN: "123456:AAHci-dummy-token"
          ALLOWED_USER_IDS: "111111, 222222"
          SIGNING_KEY: "ci-signing-key"
          RATE_LIMIT: "20"
